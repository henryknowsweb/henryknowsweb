<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0E0D0E" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="Page not found — Henry, web designer for stores and landing pages." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/assets/brand/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/assets/brand/apple-touch-icon.png" />
    <link rel="icon" href="/assets/brand/icon-512.png" sizes="512x512" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
    <title>Page not found — Henry</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #0E0D0E;
        --paper: #F2EFEA;
        --red: #F2281E;
        --mute: #8C8782;
        --line: rgba(242, 239, 234, 0.12);
        --font-display: "Inter Tight", "Helvetica Neue", Arial, sans-serif;
        --font-sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
        --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        background: var(--ink);
        color: var(--paper);
        font-family: var(--font-sans);
        font-size: 16px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }
      body::after {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 90;
        opacity: 0.05;
        background-image: url("assets/ui/grain.png");
        background-size: 256px 256px;
      }
      :focus-visible { outline: 2px solid var(--red); outline-offset: 3px; }
      .site-head { padding: 16px 20px 0; }
      @media (min-width: 640px) { .site-head { padding: 16px 56px 0; } }
      .brand { display: inline-flex; align-items: center; text-decoration: none; }
      .brand-lockup { display: block; height: 28px; width: auto; }
      main {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        justify-content: center;
        gap: 8px;
        padding: 40px 20px 72px;
      }
      @media (min-width: 640px) { main { padding: 40px 56px 72px; } }
      .kick {
        margin: 0;
        font-family: var(--font-mono);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--mute);
      }
      .code {
        margin: 0;
        font-family: var(--font-display);
        font-weight: 800;
        letter-spacing: -0.04em;
        line-height: 0.85;
        font-size: clamp(7rem, 32vw, 24rem);
        color: transparent;
        -webkit-text-stroke: 2px var(--paper);
      }
      .line { margin: 12px 0 0; font-size: 20px; line-height: 1.5; color: var(--paper); }
      .btn {
        display: inline-flex; align-items: center; gap: 10px;
        min-height: 44px;
        margin-top: 28px;
        padding: 10px 22px;
        font-size: 14px; font-weight: 800;
        letter-spacing: 0.12em; text-transform: uppercase;
        text-decoration: none;
      }
      .btn-primary { background: var(--paper); color: var(--ink); border: 1px solid var(--paper); transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease; }
      .btn-primary:hover { background: var(--red); border-color: var(--red); color: var(--paper); }
      .btn .btn-arrow { width: 15px; height: 15px; flex: none; transition: transform 0.18s ease-out; }
      .btn:hover .btn-arrow { transform: translate(2px, -2px); }
    </style>
  </head>
  <body>
    <header class="site-head">
      <a class="brand" href="/" aria-label="Henry — back home"><img class="brand-lockup" src="assets/brand/lockup.svg" alt="Henry." width="94" height="28" /></a>
    </header>
    <main>
      <p class="kick">Error 404</p>
      <p class="code" aria-hidden="true">404</p>
      <h1 class="visually-hidden" style="position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0">Page not found</h1>
      <p class="line">This page doesn&rsquo;t exist — yet.</p>
      <a class="btn btn-primary" href="/">Back home <svg class="btn-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" focusable="false" aria-hidden="true"><path d="M6 18 18 6M9 6h9v9"/></svg></a>
    </main>
  </body>
</html>
